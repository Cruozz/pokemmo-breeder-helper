name: Verify shared rules and Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: python -m pip install --target vendor -r requirements.txt pytest
      - name: Shared and desktop regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/vendor"
          python scripts/test-python.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Android SDK
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Android unit tests, lint and APK
        shell: pwsh
        run: ./scripts/build-android.ps1 -Python "$env:pythonLocation/python.exe"
